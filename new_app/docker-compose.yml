version: '3.8'

services:
  backend:
    build:
      context: ./scom_ht26
      dockerfile: Dockerfile
    container_name: hirematch-backend
    ports:
      - "8000:8000"
    volumes:
      - ./scom_ht26/app.db:/app/app.db
    environment:
      - DATABASE_URL=sqlite:///./app.db
      - PROJECT_NAME=HireMatch MVP
      - API_PREFIX=/api/v1
    restart: unless-stopped

  frontend:
    build:
      context: ./scom_ht26_fe
      dockerfile: Dockerfile
    container_name: hirematch-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped